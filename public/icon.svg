<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners for splash / display -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />

  <!-- Outer Energy Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#10b981" stroke-width="8" stroke-dasharray="16 12" opacity="0.4" />

  <!-- Glowing Sun / Beacon -->
  <circle cx="256" cy="180" r="54" fill="url(#sunGrad)" opacity="0.9" />

  <!-- Healing Twin Leaves / Lungs Motif -->
  <!-- Left Leaf -->
  <path d="M 256 360 C 180 340 140 270 160 200 C 190 190 240 230 256 360 Z" fill="url(#leafGrad)" />
  <!-- Right Leaf -->
  <path d="M 256 360 C 332 340 372 270 352 200 C 322 190 272 230 256 360 Z" fill="#6ee7b7" />
  <!-- Center Stem -->
  <path d="M 256 380 L 256 220" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.9" />

  <!-- Shield Base Spark -->
  <circle cx="256" cy="384" r="14" fill="#34d399" />
</svg>
